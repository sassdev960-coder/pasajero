name: Build Passenger AAB - Google Play

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Passenger AAB
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      # ============================================================
      # 2. NODE.JS
      # ============================================================
      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ============================================================
      # 3. JAVA 17
      # ============================================================
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: false

      # ============================================================
      # 5. ACEPTAR LICENCIAS DEL SDK
      # ============================================================
      - name: ✅ Aceptar licencias del SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          echo "✅ Licencias aceptadas"

      # ============================================================
      # 6. INSTALAR DEPENDENCIAS
      # ============================================================
      - name: 📦 Instalar dependencias npm
        run: |
          npm install --legacy-peer-deps

      # ============================================================
      # 7. CAPACITOR 6
      # ============================================================
      - name: 📱 Instalar Capacitor 6
        run: |
          npm install \
            @capacitor/core@6.2.0 \
            @capacitor/cli@6.2.0 \
            @capacitor/android@6.2.0 \
            @capacitor/geolocation@6.0.1 \
            @capacitor/push-notifications@6.0.0 \
            --legacy-peer-deps

      # ============================================================
      # 8. COMPILAR WEB (VITE)
      # ============================================================
      - name: 🏗️ Compilar aplicación web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ============================================================
      # 9. AÑADIR PLATAFORMA ANDROID
      # ============================================================
      - name: 📱 Añadir plataforma Android
        run: |
          npx cap add android

      # ============================================================
      # 9.5. INCREMENTAR VERSION CODE
      # IMPORTANTE: Cada vez que subas un AAB a Play Store, este
      # número debe ser MAYOR que el anterior. Si ya subiste el 1,
      # ahora pon 2. Si ya subiste el 2, pon 3, y así sucesivamente.
      # ============================================================
      - name: 🔢 Incrementar versionCode y versionName
        run: |
          GRADLE_FILE="android/app/build.gradle"
          sed -i 's/versionCode [0-9]*/versionCode 3/' "$GRADLE_FILE"
          sed -i 's/versionName "[^"]*"/versionName "1.2"/' "$GRADLE_FILE"
          echo "=== Versión actualizada ==="
          grep -E "versionCode|versionName" "$GRADLE_FILE"

      # ============================================================
      # 10. CONFIGURAR SDK VERSION
      # minSdk 23     = Android 6.0+
      # targetSdk 36  = Android 16 (REQUERIDO por Play desde Ago 2026)
      # compileSdk 36 = Android 16 SDK
      # ============================================================
      - name: 🔧 Configurar versiones del SDK
        run: |
          GRADLE_FILE="android/variables.gradle"
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 23/' "$GRADLE_FILE"
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/' "$GRADLE_FILE"
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/' "$GRADLE_FILE"
          echo "=== variables.gradle final ==="
          cat "$GRADLE_FILE"

      # ============================================================
      # 11. GOOGLE SERVICES / FIREBASE
      # ============================================================
      - name: 🔥 Inyectar google-services.json
        run: |
          mkdir -p android/app
          echo '${{ secrets.GOOGLE_SERVICES_JSON_PASAJERO }}' > android/app/google-services.json
          if [ -s android/app/google-services.json ]; then
            echo "✅ google-services.json creado."
          else
            echo "❌ ERROR: google-services.json vacío."
            exit 1
          fi

      # ============================================================
      # 12. GENERAR ICONOS
      # ============================================================
      - name: 🎨 Generar iconos Android
        run: |
          npx --yes @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#FFFFFF' \
            --iconBackgroundColorDark '#0a0a0b' \
            --splashBackgroundColor '#0a0a0b' \
            --splashBackgroundColorDark '#0a0a0b' \
            || echo "⚠️ Advertencia durante generación de iconos."

      # ============================================================
      # 13. IMAGEMAGICK
      # ============================================================
      - name: 🖼️ Instalar ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      # ============================================================
      # 14. ICONOS DE NOTIFICACIÓN
      # ============================================================
      - name: 🔔 Copiar iconos de notificación
        run: |
          RES="android/app/src/main/res"
          mkdir -p "$RES/drawable-mdpi" "$RES/drawable-hdpi" "$RES/drawable-xhdpi" "$RES/drawable-xxhdpi" "$RES/drawable-xxxhdpi"

          if [ -f "assets/ic_stat_ride.png" ]; then
            convert assets/ic_stat_ride.png -resize 24x24   "$RES/drawable-mdpi/ic_stat_ride.png"
            convert assets/ic_stat_ride.png -resize 36x36   "$RES/drawable-hdpi/ic_stat_ride.png"
            convert assets/ic_stat_ride.png -resize 48x48   "$RES/drawable-xhdpi/ic_stat_ride.png"
            convert assets/ic_stat_ride.png -resize 72x72   "$RES/drawable-xxhdpi/ic_stat_ride.png"
            convert assets/ic_stat_ride.png -resize 96x96   "$RES/drawable-xxxhdpi/ic_stat_ride.png"
            echo "✅ Icono pequeño instalado."
          else
            echo "⚠️ No existe assets/ic_stat_ride.png"
          fi

          if [ -f "assets/ic_notif_large.png" ]; then
            convert assets/ic_notif_large.png -resize 128x128 "$RES/drawable-mdpi/ic_notif_large.png"
            convert assets/ic_notif_large.png -resize 192x192 "$RES/drawable-hdpi/ic_notif_large.png"
            convert assets/ic_notif_large.png -resize 256x256 "$RES/drawable-xhdpi/ic_notif_large.png"
            convert assets/ic_notif_large.png -resize 384x384 "$RES/drawable-xxhdpi/ic_notif_large.png"
            convert assets/ic_notif_large.png -resize 512x512 "$RES/drawable-xxxhdpi/ic_notif_large.png"
            echo "✅ Icono grande instalado."
          else
            echo "⚠️ No existe assets/ic_notif_large.png"
          fi

      # ============================================================
      # 15. PERMISOS ANDROID
      # ============================================================
      - name: 🔐 Configurar permisos Android
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          sed -i '/android.permission.INTERNET/d' "$MANIFEST"
          sed -i '/android.permission.ACCESS_NETWORK_STATE/d' "$MANIFEST"
          sed -i '/android.permission.ACCESS_FINE_LOCATION/d' "$MANIFEST"
          sed -i '/android.permission.ACCESS_COARSE_LOCATION/d' "$MANIFEST"
          sed -i '/android.permission.WAKE_LOCK/d' "$MANIFEST"
          sed -i '/android.permission.FOREGROUND_SERVICE/d' "$MANIFEST"
          sed -i '/android.permission.VIBRATE/d' "$MANIFEST"
          sed -i '/android.permission.POST_NOTIFICATIONS/d' "$MANIFEST"

          sed -i '/<application/i\
              <uses-permission android:name="android.permission.INTERNET" />\
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\
              <uses-permission android:name="android.permission.WAKE_LOCK" />\
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\
              <uses-permission android:name="android.permission.VIBRATE" />\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\
          ' "$MANIFEST"

          echo "=== Permisos aplicados ==="
          grep "uses-permission" "$MANIFEST" || true

      # ============================================================
      # 16. SYNC CAPACITOR
      # ============================================================
      - name: 🔄 Sincronizar Capacitor
        run: |
          npx cap sync android

      # ============================================================
      # 17. DECODIFICAR KEYSTORE
      # ============================================================
      - name: 🔑 Decodificar keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "❌ ERROR: KEYSTORE_BASE64 no configurado."
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          echo "✅ Keystore decodificado"
          ls -lh android/app/release.keystore

      # ============================================================
      # 18. CREAR KEYSTORE.PROPERTIES
      # ============================================================
      - name: 📝 Crear keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "✅ keystore.properties creado"

      # ============================================================
      # 19. REESCRIBIR build.gradle
      # ============================================================
      - name: 📝 Configurar signingConfig en build.gradle
        run: |
          GRADLE_FILE="android/app/build.gradle"

          echo "=== build.gradle ANTES ==="
          cat "$GRADLE_FILE"

          python3 << 'PYEOF'
          import re

          gradle_file = "android/app/build.gradle"
          with open(gradle_file, "r") as f:
              content = f.read()

          keystore_block = '''
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          '''
          content = re.sub(r'\nandroid\s*\{', '\n' + keystore_block + 'android {', content, count=1)

          content = re.sub(r'signingConfigs\s*\{[^}]*\{[^}]*\}[^}]*\}', '', content, flags=re.DOTALL)

          signing_configs = '''
              signingConfigs {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          storeFile file(keystoreProperties["storeFile"])
                          storePassword keystoreProperties["storePassword"]
                          keyAlias keystoreProperties["keyAlias"]
                          keyPassword keystoreProperties["keyPassword"]
                      }
                  }
              }
          '''
          content = re.sub(r'(android\s*\{)', r'\1' + signing_configs, content, count=1)

          content = re.sub(
              r'(buildTypes\s*\{[\s\S]*?release\s*\{)',
              r'\1\n            signingConfig signingConfigs.release',
              content,
              count=1
          )

          with open(gradle_file, "w") as f:
              f.write(content)

          print("✅ build.gradle modificado")
          PYEOF

          echo ""
          echo "=== build.gradle DESPUÉS ==="
          cat "$GRADLE_FILE"

      # ============================================================
      # 20. VERIFICAR CONFIGURACIÓN
      # ============================================================
      - name: 🧪 Verificar configuración
        run: |
          echo "=== variables.gradle ==="
          cat android/variables.gradle
          echo ""
          echo "=== signingConfigs en build.gradle ==="
          grep -A 10 "signingConfigs" android/app/build.gradle || true

      # ============================================================
      # 21. COMPILAR AAB
      # ============================================================
      - name: 🔨 Compilar App Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      # ============================================================
      # 22. VERIFICAR AAB
      # ============================================================
      - name: 🔎 Verificar AAB
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "❌ ERROR: No se generó el AAB."
            find android/app/build/outputs -type f || true
            exit 1
          fi
          echo "✅ AAB generado:"
          ls -lh "$AAB"

      # ============================================================
      # 23. SUBIR AAB
      # ============================================================
      - name: 📤 Subir AAB
        uses: actions/upload-artifact@v4
        with:
          name: moto-movil-pasajero-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ============================================================
      # 24. SUBIR ARCHIVO DE DESOFUSCACIÓN (mapping.txt)
      # ============================================================
      - name: 📤 Subir mapping.txt (desofuscación)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moto-movil-pasajero-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: warn

      # ============================================================
      # 25. RESUMEN
      # ============================================================
      - name: 🎉 Resumen
        run: |
          echo "## ✅ AAB generado correctamente" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 📱 minSdk: API 23 (Android 6.0+)" >> $GITHUB_STEP_SUMMARY
          echo "- 📱 targetSdk: API 36 (Android 16)" >> $GITHUB_STEP_SUMMARY
          echo "- 🛠️ compileSdk: API 36" >> $GITHUB_STEP_SUMMARY
          echo "- 🔢 versionCode: 2 / versionName: 1.1" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ Capacitor: 6.2.0" >> $GITHUB_STEP_SUMMARY
          echo "- 🔐 Firmado con keystore de release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Descarga el AAB y el mapping.txt en **Artifacts**." >> $GITHUB_STEP_SUMMARY
