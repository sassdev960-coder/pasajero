name: Build Passenger APK - Android 9

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Passenger APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: 📥 Checkout código
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE.JS
      # ============================================================
      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # ============================================================
      # 3. JAVA
      # Capacitor 6 / Android
      # ============================================================
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'


      # ============================================================
      # 4. ANDROID SDK
      # FIX: Ya no pedimos paquetes específicos aquí (Gradle los
      # descargará solo). Desactivamos la aceptación automática
      # porque la acción se queda colgada con las licencias nuevas
      # de Google TV / Android TV.
      # ============================================================
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: false


      # ============================================================
      # 5. ACEPTAR TODAS LAS LICENCIAS DEL SDK
      # FIX: Responde "y" a TODAS las licencias (incluye GoogleTV,
      # Android TV, etc. que la acción desconoce).
      # ============================================================
      - name: ✅ Aceptar todas las licencias del SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          echo "✅ Licencias aceptadas"
          echo ""
          echo "=== Paquetes instalados actualmente ==="
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null | head -20 || true


      # ============================================================
      # 6. INSTALAR DEPENDENCIAS DEL PROYECTO
      # ============================================================
      - name: 📦 Instalar dependencias npm
        run: |
          npm install --legacy-peer-deps


      # ============================================================
      # 7. FIJAR CAPACITOR 6
      # ============================================================
      - name: 📱 Instalar Capacitor 6.2.0
        run: |
          npm install \
            @capacitor/core@6.2.0 \
            @capacitor/cli@6.2.0 \
            @capacitor/android@6.2.0 \
            @capacitor/geolocation@6.0.1 \
            @capacitor/push-notifications@6.0.0 \
            --legacy-peer-deps


      # ============================================================
      # 8. VERIFICAR VERSIONES
      # ============================================================
      - name: 🔎 Verificar versiones instaladas
        run: |
          echo "========================================"
          echo "NODE"
          echo "========================================"
          node --version

          echo ""
          echo "========================================"
          echo "NPM"
          echo "========================================"
          npm --version

          echo ""
          echo "========================================"
          echo "JAVA"
          echo "========================================"
          java -version

          echo ""
          echo "========================================"
          echo "CAPACITOR"
          echo "========================================"

          npm list \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/geolocation \
            @capacitor/push-notifications \
            --depth=0 || true


      # ============================================================
      # 9. COMPILAR VITE / REACT
      # ============================================================
      - name: 🏗️ Compilar aplicación web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}


      # ============================================================
      # 10. CREAR PROYECTO ANDROID
      # ============================================================
      - name: 📱 Añadir plataforma Android
        run: |
          npx cap add android


      # ============================================================
      # 11. CONFIGURAR ANDROID 9
      #
      # Android 9 = API 28
      #
      # minSdk 23     = Android 6+
      # targetSdk 28  = Android 9
      # compileSdk 34 = Android 14 SDK (requerido por Capacitor)
      # ============================================================
      - name: 🔧 Configurar compatibilidad Android 9
        run: |
          GRADLE_FILE="android/variables.gradle"

          echo "========================================"
          echo "VARIABLES ORIGINALES"
          echo "========================================"

          cat "$GRADLE_FILE"

          echo ""
          echo "========================================"
          echo "CONFIGURANDO"
          echo "========================================"

          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 23/' "$GRADLE_FILE"
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 28/' "$GRADLE_FILE"
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 34/' "$GRADLE_FILE"

          echo ""
          echo "========================================"
          echo "VARIABLES FINALES"
          echo "========================================"

          cat "$GRADLE_FILE"


      # ============================================================
      # 12. GOOGLE SERVICES / FIREBASE
      # ============================================================
      - name: 🔥 Inyectar google-services.json
        run: |
          mkdir -p android/app

          echo '${{ secrets.GOOGLE_SERVICES_JSON_PASAJERO }}' \
            > android/app/google-services.json

          if [ -s android/app/google-services.json ]; then
            echo "✅ google-services.json correctamente creado."
          else
            echo "❌ ERROR: google-services.json está vacío."
            exit 1
          fi


      # ============================================================
      # 13. VERIFICAR ASSETS
      # ============================================================
      - name: 🔍 Verificar assets
        run: |
          echo "========================================"
          echo "ASSETS"
          echo "========================================"

          ls -la assets/ || echo "⚠️ No existe carpeta assets/"

          echo ""

          for f in \
            icon-only.png \
            icon-foreground.png \
            icon-background.png \
            ic_stat_ride.png \
            ic_notif_large.png
          do
            if [ -f "assets/$f" ]; then
              echo "✅ $f"
            else
              echo "⚠️ Falta $f"
            fi
          done


      # ============================================================
      # 14. GENERAR ICONOS
      # ============================================================
      - name: 🎨 Generar iconos Android
        run: |
          npx --yes @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#FFFFFF' \
            --iconBackgroundColorDark '#0a0a0b' \
            --splashBackgroundColor '#0a0a0b' \
            --splashBackgroundColorDark '#0a0a0b' \
            || echo "⚠️ Advertencia durante generación de iconos."


      # ============================================================
      # 15. INSTALAR IMAGEMAGICK
      # ============================================================
      - name: 🖼️ Instalar ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick


      # ============================================================
      # 16. ICONOS DE NOTIFICACIÓN
      # ============================================================
      - name: 🔔 Copiar iconos de notificación
        run: |
          RES="android/app/src/main/res"

          mkdir -p "$RES/drawable-mdpi"
          mkdir -p "$RES/drawable-hdpi"
          mkdir -p "$RES/drawable-xhdpi"
          mkdir -p "$RES/drawable-xxhdpi"
          mkdir -p "$RES/drawable-xxxhdpi"


          # --------------------------------------------------------
          # ICONO PEQUEÑO
          # --------------------------------------------------------

          if [ -f "assets/ic_stat_ride.png" ]; then

            convert assets/ic_stat_ride.png \
              -resize 24x24 \
              "$RES/drawable-mdpi/ic_stat_ride.png"

            convert assets/ic_stat_ride.png \
              -resize 36x36 \
              "$RES/drawable-hdpi/ic_stat_ride.png"

            convert assets/ic_stat_ride.png \
              -resize 48x48 \
              "$RES/drawable-xhdpi/ic_stat_ride.png"

            convert assets/ic_stat_ride.png \
              -resize 72x72 \
              "$RES/drawable-xxhdpi/ic_stat_ride.png"

            convert assets/ic_stat_ride.png \
              -resize 96x96 \
              "$RES/drawable-xxxhdpi/ic_stat_ride.png"

            echo "✅ Icono pequeño de notificación instalado."

          else

            echo "⚠️ No existe ic_stat_ride.png"

          fi


          # --------------------------------------------------------
          # ICONO GRANDE
          # --------------------------------------------------------

          if [ -f "assets/ic_notif_large.png" ]; then

            convert assets/ic_notif_large.png \
              -resize 128x128 \
              "$RES/drawable-mdpi/ic_notif_large.png"

            convert assets/ic_notif_large.png \
              -resize 192x192 \
              "$RES/drawable-hdpi/ic_notif_large.png"

            convert assets/ic_notif_large.png \
              -resize 256x256 \
              "$RES/drawable-xhdpi/ic_notif_large.png"

            convert assets/ic_notif_large.png \
              -resize 384x384 \
              "$RES/drawable-xxhdpi/ic_notif_large.png"

            convert assets/ic_notif_large.png \
              -resize 512x512 \
              "$RES/drawable-xxxhdpi/ic_notif_large.png"

            echo "✅ Icono grande de notificación instalado."

          else

            echo "⚠️ No existe ic_notif_large.png"

          fi


      # ============================================================
      # 17. PERMISOS
      # ============================================================
      - name: 🔐 Configurar permisos Android
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "========================================"
          echo "CONFIGURANDO PERMISOS"
          echo "========================================"

          # Eliminar posibles duplicados creados anteriormente
          sed -i '/android.permission.INTERNET/d' "$MANIFEST"
          sed -i '/android.permission.ACCESS_NETWORK_STATE/d' "$MANIFEST"
          sed -i '/android.permission.ACCESS_FINE_LOCATION/d' "$MANIFEST"
          sed -i '/android.permission.ACCESS_COARSE_LOCATION/d' "$MANIFEST"
          sed -i '/android.permission.WAKE_LOCK/d' "$MANIFEST"
          sed -i '/android.permission.FOREGROUND_SERVICE/d' "$MANIFEST"
          sed -i '/android.permission.VIBRATE/d' "$MANIFEST"
          sed -i '/android.permission.POST_NOTIFICATIONS/d' "$MANIFEST"

          sed -i '/<application/i\
              <uses-permission android:name="android.permission.INTERNET" />\
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\
              <uses-permission android:name="android.permission.WAKE_LOCK" />\
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\
              <uses-permission android:name="android.permission.VIBRATE" />\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\
          ' "$MANIFEST"

          echo ""
          echo "========================================"
          echo "PERMISOS FINALES"
          echo "========================================"

          grep "uses-permission" "$MANIFEST" || true


      # ============================================================
      # 18. COPIAR ASSETS WEB AL PROYECTO ANDROID
      # FIX: Este paso faltaba. Sin él, si recompilas la web sin
      # reconstruir Android desde cero, el APK puede quedar con
      # assets viejos. Copia dist/ -> android/app/src/main/assets/public
      # ============================================================
      - name: 📋 Copiar assets web al proyecto Android
        run: |
          npx cap copy android
          echo "✅ Assets web copiados al proyecto Android"
          echo ""
          echo "=== Contenido de assets/public ==="
          ls -la android/app/src/main/assets/public/ 2>/dev/null | head -15 || echo "⚠️ No se encontró assets/public"


      # ============================================================
      # 19. SYNC CAPACITOR
      # ============================================================
      - name: 🔄 Sincronizar Capacitor
        run: |
          npx cap sync android


      # ============================================================
      # 20. VERIFICAR CONFIGURACIÓN FINAL
      # ============================================================
      - name: 🧪 Verificar configuración Android
        run: |
          echo "========================================"
          echo "VARIABLES GRADLE"
          echo "========================================"

          cat android/variables.gradle

          echo ""
          echo "========================================"
          echo "ANDROID MANIFEST"
          echo "========================================"

          grep -E "uses-permission|uses-feature" \
            android/app/src/main/AndroidManifest.xml || true


      # ============================================================
      # 21. COMPILAR APK
      # ============================================================
      - name: 🔨 Compilar APK
        run: |
          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon


      # ============================================================
      # 22. VERIFICAR APK
      # ============================================================
      - name: 🔎 Verificar APK compilado
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "❌ ERROR: No se generó el APK."
            exit 1
          fi

          echo "========================================"
          echo "APK GENERADO"
          echo "========================================"

          ls -lh "$APK"

          echo ""
          echo "========================================"
          echo "SDK DEL APK"
          echo "========================================"

          AAPT=$(find "$ANDROID_HOME/build-tools" \
            -name aapt \
            -type f \
            | sort -V \
            | tail -1)

          if [ -n "$AAPT" ]; then

            "$AAPT" dump badging "$APK" \
              | grep -E \
              "package:|sdkVersion|targetSdkVersion" \
              || true

          else

            echo "⚠️ aapt no encontrado."
          fi


      # ============================================================
      # 23. SUBIR APK
      # ============================================================
      - name: 📤 Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: moto-movil-pasajero-android9-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30


      # ============================================================
      # 24. RESUMEN
      # ============================================================
      - name: 🎉 Resumen
        run: |
          echo "## ✅ APK del pasajero generado correctamente" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Configuración" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- 📱 Android mínimo: API 23 (Android 6)" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- 📱 Android objetivo: API 28 (Android 9)" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- 🛠️ Compile SDK: API 34" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- ⚡ Capacitor: 6.2.0" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- 📍 Geolocation: 6.0.1" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- 🔔 Push Notifications: 6.0.0" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- 🟢 Node.js: 22" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- ☕ Java: 17" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "📦 APK disponible en Artifacts." \
            >> "$GITHUB_STEP_SUMMARY"
