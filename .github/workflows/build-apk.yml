name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: 📦 Instalar dependencias npm
        run: npm install --legacy-peer-deps

      - name: 📱 Instalar Capacitor
        run: npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/geolocation@latest @capacitor/push-notifications@latest --legacy-peer-deps

      - name: 🏗️ Compilar app web (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 📱 Añadir plataforma Android
        run: npx cap add android

      - name: 🔥 Inyectar google-services.json
        run: |
          mkdir -p android/app
          echo '${{ secrets.GOOGLE_SERVICES_JSON_PASAJERO }}' > android/app/google-services.json
          echo "google-services.json inyectado:"
          head -c 200 android/app/google-services.json

      - name: 🔍 Verificar assets
        run: |
          echo "=== Contenido de assets/ ==="
          ls -la assets/ || echo "No existe carpeta assets/"
          echo "=== Verificando archivos ==="
          for f in icon-only.png icon-foreground.png icon-background.png ic_stat_ride.png ic_notif_large.png; do
            if [ -f "assets/$f" ]; then
              echo "OK: assets/$f ($(du -h assets/$f | cut -f1))"
            else
              echo "FALTA: assets/$f"
            fi
          done

      - name: 🎨 Generar iconos con @capacitor/assets
        run: |
          npx --yes @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#FFFFFF' \
            --iconBackgroundColorDark '#0a0a0b' \
            --splashBackgroundColor '#0a0a0b' \
            --splashBackgroundColorDark '#0a0a0b' || echo "Aviso: error en generacion, continuando..."

      - name: 🖼️ Instalar ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: 🔔 Copiar iconos de notificación
        run: |
          RES=android/app/src/main/res
          mkdir -p $RES/drawable-mdpi $RES/drawable-hdpi $RES/drawable-xhdpi $RES/drawable-xxhdpi $RES/drawable-xxxhdpi
          if [ -f "assets/ic_stat_ride.png" ]; then
            convert assets/ic_stat_ride.png -resize 24x24  $RES/drawable-mdpi/ic_stat_ride.png
            convert assets/ic_stat_ride.png -resize 36x36  $RES/drawable-hdpi/ic_stat_ride.png
            convert assets/ic_stat_ride.png -resize 48x48  $RES/drawable-xhdpi/ic_stat_ride.png
            convert assets/ic_stat_ride.png -resize 72x72  $RES/drawable-xxhdpi/ic_stat_ride.png
            convert assets/ic_stat_ride.png -resize 96x96  $RES/drawable-xxxhdpi/ic_stat_ride.png
            echo "OK: icono notif pequeño copiado"
          fi
          if [ -f "assets/ic_notif_large.png" ]; then
            convert assets/ic_notif_large.png -resize 128x128 $RES/drawable-mdpi/ic_notif_large.png
            convert assets/ic_notif_large.png -resize 192x192 $RES/drawable-hdpi/ic_notif_large.png
            convert assets/ic_notif_large.png -resize 256x256 $RES/drawable-xhdpi/ic_notif_large.png
            convert assets/ic_notif_large.png -resize 384x384 $RES/drawable-xxhdpi/ic_notif_large.png
            convert assets/ic_notif_large.png -resize 512x512 $RES/drawable-xxxhdpi/ic_notif_large.png
            echo "OK: icono notif grande copiado"
          fi

      - name: 🔓 Añadir permisos al AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.VIBRATE" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' $MANIFEST
          echo "✅ Permisos añadidos"

      - name: 🔄 Sync Capacitor
        run: npx cap sync android

      - name: 🔨 Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: moto-movil-pasajero-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🎉 Resumen
        run: |
          echo "## ✅ APK generado correctamente" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Descarga el APK en la sección Artifacts** (abajo del todo)" >> $GITHUB_STEP_SUMMARY
