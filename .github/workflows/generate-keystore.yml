name: Generar Keystore (solo una vez)

on:
  workflow_dispatch:

jobs:
  generar:
    name: Generar keystore y mostrarlo
    runs-on: ubuntu-latest

    steps:
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔑 Generar keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias motomovil \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass MotoMovil2026Segura \
            -keypass MotoMovil2026Segura \
            -dname "CN=Moto Movil, OU=Desarrollo, O=Moto Movil, L=Santa Cruz, ST=Santa Cruz, C=BO"

          echo "✅ Keystore generado"
          ls -la release.keystore

      - name: 📝 Convertir a Base64
        run: |
          base64 -w 0 release.keystore > keystore_base64.txt

      - name: 📤 Subir keystore como artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-moto-movil
          path: |
            release.keystore
            keystore_base64.txt
          retention-days: 7

      - name: 📋 Mostrar Base64 en el resumen
        run: |
          echo "## 🔑 Keystore generado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Alias:** \`motomovil\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Contraseña (store y key):** \`MotoMovil2026Segura\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Contenido de KEYSTORE_BASE64 (copia TODO):**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat keystore_base64.txt >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
